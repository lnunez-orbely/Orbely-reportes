
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard de Inversión y Rentabilidad</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* TEMA: AZUL, NEGRO Y AMARILLO */
        :root {
            --primary: #000000;      /* Negro puro */
            --accent: #0047AB;       /* Azul Orbely */
            --yellow: #FFC107;       /* Amarillo vibrante */
            --bg: #f4f7fa;           /* Fondo gris azulado muy claro */
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg); color: var(--primary);
            margin: 0; padding: 15px;
        }
        .container {
            max-width: 1300px; margin: auto;
            background: white; padding: 25px;
            border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px;
        }
        .logo { max-height: 45px; }

        .lot-selector {
            padding: 8px 12px; font-size: 14px; font-weight: bold; color: var(--primary);
            border: 2px solid var(--accent); border-radius: 8px; outline: none;
            background-color: white; cursor: pointer; margin-top: 5px;
        }

        .dashboard-grid {
            display: grid; grid-template-columns: 1.3fr 1fr; gap: 25px;
        }

        .metric-card {
            background: white; padding: 12px; border-radius: 12px;
            border: 1px solid #e2e8f0; text-align: center; transition: all 0.3s ease;
        }
        .metric-card label { display: block; font-size: 9px; font-weight: 800; color: #64748b; text-transform: uppercase; margin-bottom: 3px; }
        .metric-card span { font-size: 18px; font-weight: 800; color: var(--primary); }

        /* Tarjeta Indiferencia (Amarilla) */
        .metric-card.indif { background: #fffdf0; border-color: #fde68a; }
        .metric-card.indif span { color: var(--primary); }
        .metric-card.indif label { color: #b45309; }

        /* Tarjetas de Precios (Azul y Amarilla) */
        .price-card {
            background: #e8f0fe; padding: 12px; border-radius: 12px; border: 1px solid #bbd0f2;
            display: flex; align-items: center; justify-content: space-between;
        }
        .price-card label { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; }

        .price-card.yield {
            background: #fffdf0; border-color: #fde68a;
        }
        .price-card.yield label { color: #b45309; }

        .chart-box {
            background: #fff; border-radius: 15px; border: 1px solid #f1f5f9;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        .chart-container { position: relative; height: 550px; width: 100%; }

        .card-table {
            background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0;
        }
        .card-table h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--primary); text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; font-weight: 800;}

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 8px; font-size: 10px; color: #64748b; text-transform: uppercase; border-bottom: 2px solid #f1f5f9; }
        td { padding: 8px; border-bottom: 1px solid #f8fafc; font-size: 13px; }

        input[type="number"], input[type="text"] {
            padding: 6px 8px; border: 1px solid #cbd5e1;
            border-radius: 6px; font-size: 13px; font-weight: 700;
        }
        input[type="number"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 2px rgba(0,71,171,0.2); }

        .td-input-number { width: 80px; text-align: right; }

        .add-cost-row {
            display: flex; gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px dashed #cbd5e1; align-items: center;
        }
        .btn-add {
            background: var(--primary); color: white; border: none; padding: 7px 15px;
            border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s;
            font-size: 13px; white-space: nowrap; text-transform: uppercase;
        }
        .btn-add:hover { background: #333333; }

        .footer { text-align: center; margin-top: 30px; font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }

        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>

    <script>
        // Datos de todos los lotes inyectados desde Python
        const allLotsData = {"L1 Riego": [{"insumos": "Riego", "costo": 127.6}, {"insumos": "Semilla", "costo": 110.63}, {"insumos": "Cosecha", "costo": 109.15}, {"insumos": "Fertilizantes", "costo": 103.4}, {"insumos": "Herbicidas", "costo": 84.6}, {"insumos": "Siembra", "costo": 47.5}, {"insumos": "Insecticidas", "costo": 25.6}, {"insumos": "Fumigacion", "costo": 17.06}, {"insumos": "Fumigacion Aerea", "costo": 9.44}, {"insumos": "Fungicidas", "costo": 4.75}], "L1 Secano": [{"insumos": "Semilla", "costo": 110.63}, {"insumos": "Cosecha", "costo": 109.15}, {"insumos": "Herbicidas", "costo": 84.6}, {"insumos": "Siembra", "costo": 47.5}, {"insumos": "Fertilizantes", "costo": 27.45}, {"insumos": "Insecticidas", "costo": 25.6}, {"insumos": "Fumigacion", "costo": 17.06}, {"insumos": "Fumigacion Aerea", "costo": 9.44}, {"insumos": "Fungicidas", "costo": 4.75}, {"insumos": "Riego", "costo": 0.0}], "L4 Riego": [{"insumos": "Riego", "costo": 122.1}, {"insumos": "Fertilizantes", "costo": 119.35000000000001}, {"insumos": "Semilla", "costo": 110.64}, {"insumos": "Cosecha", "costo": 109.15}, {"insumos": "Herbicidas", "costo": 90.7}, {"insumos": "Siembra", "costo": 47.54}, {"insumos": "Insecticidas", "costo": 25.59}, {"insumos": "Fumigacion", "costo": 17.66}, {"insumos": "Fumigacion Aerea", "costo": 9.44}, {"insumos": "Fungicidas", "costo": 5.14}], "L4 Secano": [{"insumos": "Semilla", "costo": 110.64}, {"insumos": "Cosecha", "costo": 109.15}, {"insumos": "Herbicidas", "costo": 90.7}, {"insumos": "Siembra", "costo": 47.54}, {"insumos": "Fertilizantes", "costo": 37.35}, {"insumos": "Insecticidas", "costo": 25.59}, {"insumos": "Fumigacion", "costo": 17.66}, {"insumos": "Fumigacion Aerea", "costo": 9.44}, {"insumos": "Fungicidas", "costo": 5.14}, {"insumos": "Riego", "costo": 0.0}]};

        // PALETA RESTRINGIDA: Azules, Negros, Grises y Amarillos
        const vibrantPalette = [
            '#0047AB', // Azul Orbely
            '#FFC107', // Amarillo
            '#000000', // Negro
            '#1E88E5', // Azul Claro
            '#FFD54F', // Amarillo Claro
            '#1e293b', // Gris Oscuro/Negro Suave
            '#0D47A1', // Azul Oscuro
            '#FFA000', // Amarillo Oscuro / Ambar
            '#42A5F5', // Celeste
            '#475569', // Gris
            '#FFCA28', // Oro
            '#1565C0'  // Azul Medio
        ];

        let currentLot = "";
        let items = []; // Puntero a los datos del lote actual
        let costChart;

        function getBgColors() {
            return items.map((_, i) => vibrantPalette[i % vibrantPalette.length]);
        }

        function init() {
            // 1. Poblar el selector de Lotes
            const select = document.getElementById('lot-select');
            Object.keys(allLotsData).forEach(lotName => {
                let opt = document.createElement('option');
                opt.value = lotName;
                opt.innerText = lotName;
                select.appendChild(opt);
            });

            // 2. Definir Lote Inicial
            currentLot = select.value;
            items = allLotsData[currentLot];

            // 3. Inicializar Gráfico
            const ctx = document.getElementById('costChart').getContext('2d');
            costChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: items.map(i => i.insumos),
                    datasets: [{
                        data: items.map(i => i.costo),
                        backgroundColor: getBgColors(),
                        borderWidth: 5,
                        borderColor: '#ffffff',
                        hoverOffset: 25
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    devicePixelRatio: window.devicePixelRatio || 1,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 15,
                                padding: 20,
                                font: { size: 13, weight: 'bold' },
                                color: '#1e293b'
                            }
                        },
                        tooltip: { padding: 15, callbacks: { label: (i) => ' USD ' + i.raw.toLocaleString() } }
                    },
                    cutout: '65%'
                }
            });

            updateUIForLot();
        }

        function changeLot() {
            // Cambiar el lote actual cuando se usa el selector
            currentLot = document.getElementById('lot-select').value;
            items = allLotsData[currentLot]; // Actualiza el puntero de datos

            // Actualizar etiquetas y colores base del gráfico
            costChart.data.labels = items.map(i => i.insumos);
            costChart.data.datasets[0].backgroundColor = getBgColors();

            updateUIForLot();
        }

        function updateUIForLot() {
            // Actualizar textos dinámicos
            document.getElementById('chart-title').innerText = 'Distribución de Costos - ' + currentLot;
            document.getElementById('table-lot-badge').innerText = currentLot;

            renderTable();
            updateAll();
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            items.forEach((item, i) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td style="font-weight:600;"><span style="color:${vibrantPalette[i % vibrantPalette.length]}">●</span> ${item.insumos}</td>
                    <td style="text-align:right;"><input type="number" class="td-input-number" id="input-${i}" value="${item.costo}" step="any" oninput="updateValue(${i}, this.value)"></td>
                    <td style="text-align:right; font-weight:800; color:#64748b;" id="pct-${i}">0%</td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateValue(index, val) {
            let cleanVal = parseFloat(val);
            if (isNaN(cleanVal)) cleanVal = 0;
            items[index].costo = cleanVal; // Esto actualiza allLotsData automáticamente
            updateAll();
        }

        function addNewCost() {
            const nameInput = document.getElementById('new-cost-name');
            const valInput = document.getElementById('new-cost-val');

            const name = nameInput.value.trim();
            let val = parseFloat(valInput.value);

            if (!name) {
                alert('Por favor, ingresa un nombre para el nuevo insumo.');
                nameInput.focus();
                return;
            }
            if (isNaN(val) || val < 0) val = 0;

            // Agregar al arreglo de datos del lote actual
            items.push({
                'insumos': name,
                'costo': val
            });

            // Limpiar inputs
            nameInput.value = '';
            valInput.value = '';

            // Actualizar estructura del gráfico (labels y colores)
            costChart.data.labels = items.map(i => i.insumos);
            costChart.data.datasets[0].backgroundColor = getBgColors();

            // Re-renderizar todo
            renderTable();
            updateAll();
        }

        function updateAll() {
            // 1. Obtener inputs principales
            let pVenta = parseFloat(document.getElementById('in-precio-venta').value);
            if (isNaN(pVenta) || pVenta <= 0) pVenta = 1;

            let rendimiento = parseFloat(document.getElementById('in-rendimiento').value);
            if (isNaN(rendimiento)) rendimiento = 0;

            // 2. Cálculos para el LOTE ACTUAL
            const totalCosto = items.reduce((sum, i) => sum + i.costo, 0);
            const indif = totalCosto / pVenta;
            const ingreso = rendimiento * pVenta;
            const margenBruto = ingreso - totalCosto;

            // 3. Actualizar textos
            document.getElementById('txt-total-costo').innerText = '$ ' + totalCosto.toLocaleString(undefined, {maximumFractionDigits: 0});
            document.getElementById('txt-indiferencia').innerText = indif.toFixed(2) + ' tn';

            // Actualizar Margen Bruto y color dinámico (Positivo: Azul / Negativo: Negro con letras Amarillas)
            const elMargen = document.getElementById('txt-margen-bruto');
            const cardMargen = document.getElementById('card-margen');
            elMargen.innerText = '$ ' + margenBruto.toLocaleString(undefined, {maximumFractionDigits: 0});

            if (margenBruto >= 0) {
                // GANANCIA: AZUL
                cardMargen.style.backgroundColor = '#e8f0fe';
                cardMargen.style.borderColor = '#bbd0f2';
                elMargen.style.color = '#0047AB';
            } else {
                // PÉRDIDA: NEGRO Y AMARILLO
                cardMargen.style.backgroundColor = '#111111';
                cardMargen.style.borderColor = '#000000';
                elMargen.style.color = '#FFC107';
            }

            // 4. Actualizar porcentajes de la tabla
            items.forEach((item, i) => {
                const pct = totalCosto > 0 ? ((item.costo / totalCosto) * 100).toFixed(1) : 0;
                document.getElementById('pct-' + i).innerText = pct + '%';
            });

            // 5. Actualizar data del gráfico
            costChart.data.datasets[0].data = items.map(i => i.costo);
            costChart.update('none');
        }

        window.onload = init;
    </script>
</body>
</html>
